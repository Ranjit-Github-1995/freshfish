<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07192b">
<title>You're offline · Fresh Fish Market</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #07192b; color: #e8f4f8;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box; text-align: center;
  }
  .box { max-width: 340px; }
  img { width: 96px; height: 96px; border-radius: 24px; }
  h1 { font-family: "Playfair Display", Georgia, serif; font-size: 1.6rem; margin: 20px 0 8px; }
  p { color: #7da8c0; line-height: 1.6; margin: 0 0 24px; }
  button {
    background: #00b4d8; color: #07192b; border: 0; border-radius: 12px;
    padding: 14px 28px; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <img src="icons/icon-192.png" alt="">
    <h1>No internet connection</h1>
    <p>Connect to Wi-Fi or mobile data to see today's fish and place your order.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
